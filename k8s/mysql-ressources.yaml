apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-ressources
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-ressources
  template:
    metadata:
      labels:
        app: mysql-ressources
    spec:
      containers:
        - name: mysql-ressources
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: ressources_db
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-ressources
spec:
  selector:
    app: mysql-ressources
  ports:
    - port: 3306
      targetPort: 3306
