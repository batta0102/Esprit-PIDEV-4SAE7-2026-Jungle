apiVersion: apps/v1
kind: Deployment
metadata:
  name: jungle-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jungle-frontend
  template:
    metadata:
      labels:
        app: jungle-frontend
    spec:
      containers:
        - name: jungle-frontend
          image: jungle-frontend-test:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: jungle-frontend
spec:
  type: NodePort
  selector:
    app: jungle-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080