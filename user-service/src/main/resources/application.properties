spring.application.name=user-service
server.port=${USER_SERVICE_PORT:8083}

spring.datasource.url=${USER_DB_URL:jdbc:mysql://localhost:3306/user_service?createDatabaseIfNotExist=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${USER_DB_USERNAME:root}
spring.datasource.password=${USER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${USER_DB_DDL_AUTO:update}
spring.jpa.show-sql=${USER_DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/jungle-realm}
app.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8180}
app.keycloak.realm=${KEYCLOAK_REALM:jungle-realm}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:admin-cli}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:7sZWo3AhnxRZoDMDcI5oSpVbdtDtoJ9n}

app.keycloak.admin-realm=${KEYCLOAK_ADMIN_REALM:master}
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
app.keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
app.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
