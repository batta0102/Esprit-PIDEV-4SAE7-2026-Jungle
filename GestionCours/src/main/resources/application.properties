spring.application.name=GestionCours
server.port=8090

# Pas de context-path par défaut : URL complète = http://host:port/api/recommend
# Si SERVER_SERVLET_CONTEXT_PATH=/api (Docker / gateway), le DispatcherServlet voit le chemin /recommend pour cette même URL :
# le contrôleur expose aussi POST /recommend pour ce cas.
# server.servlet.context-path=

# Facultatif : lister les mappings MVC au démarrage (logs RequestMappingHandlerMapping).
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/gestioncours?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Toujours exécuter schema.sql au démarrage pour garantir la table de log recommendation_request_log.
spring.sql.init.mode=always

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Sketchfab Data API v3 (recherche modèles) — token optionnel : Authorization: Token …
sketchfab.data-api.base-url=https://api.sketchfab.com
sketchfab.data-api.token=

# Handshake WebSocket STOMP (dev Angular) — séparateur virgule
app.websocket.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# CORS REST (front séparé, navigateur) — séparateur virgule ; origine exacte du client
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Passerelle vers le microservice ML FastAPI (POST /recommend)
app.ml.recommendation.base-url=http://localhost:8000
app.ml.recommendation.timeout-seconds=30

# Date Format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Booking overload business thresholds
booking.overload.weekly-limit-hours=20
booking.overload.daily-warning-hours=6
booking.overload.session-duration-hours=2

# --- TEMP (auth): ID utilisateur simule pour /api/notifications/* — garder jusqu'au branchement JWT / Spring Security, puis supprimer cette ligne ou l'injecter depuis le token ---
notifications.debug-user-id=1
# --- TEMP DEBUG: GET /api/debug/notifications = statut ; POST = creation si true — remettre false avant prod ---
notifications.debug-create-endpoint-enabled=false
# Destinataire des notifications auto « cours créé / modifié » (démo : même utilisateur que la cloche REST)
notifications.course-event-recipient-user-id=1

# Eureka Discovery Service Configuration
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8762/eureka/
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance-id:${random.value}}
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
